[build-system]
requires = [
    "setuptools>=61"
]
build-backend = "setuptools.build_meta"



[project]

name = "agent-skill-security"

version = "1.0.1"

description = "Open-source security scanner for AI agents, skills, plugins and automation scripts"

authors = [
    {name="jilejiang10-create"}
]


readme = "README.md"

license = {file = "LICENSE"}


requires-python = ">=3.9"

dependencies = []


keywords = [
    "ai-security",
    "llm-security",
    "agent-security",
    "prompt-injection",
    "cybersecurity",
    "security-scanner"
]


classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

[project.optional-dependencies]
web = [
    "streamlit>=1.36,<2"
]
test = [
    "pytest>=7,<10"
]



[project.scripts]

agent-security = "agent_skill_security.cli:main"

[project.urls]
Homepage = "https://github.com/jilejiang10-create/agent-skill-security"
Repository = "https://github.com/jilejiang10-create/agent-skill-security"
Issues = "https://github.com/jilejiang10-create/agent-skill-security/issues"
Changelog = "https://github.com/jilejiang10-create/agent-skill-security/blob/main/CHANGELOG.md"



[tool.setuptools.packages.find]

where = [
    "src"
]
