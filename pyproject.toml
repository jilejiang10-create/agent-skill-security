[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-skill-security"
version = "0.1.0"
description = "Open-source security scanner for AI agents, skills, plugins and automation scripts"
authors = [
    {name="jilejiang10-create"}
]
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
agent-scan = "agent_skill_security.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
